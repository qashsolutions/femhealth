<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#FAF7F2"/>
  <text x="21" y="30" font-family="SF Pro, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#2D2926">9:41</text>
  <rect x="336" y="17" width="25" height="12" rx="3" stroke="#2D2926" stroke-width="1"/>
  <rect x="338" y="19" width="18" height="8" rx="2" fill="#2D2926"/>
  <rect x="361" y="20" width="1.5" height="5" rx="0.5" fill="#2D2926"/>

  <!-- Background -->
  <rect y="44" width="375" height="768" fill="#FAF7F2"/>

  <!-- Logo Section -->
  <g transform="translate(0, 100)">
    <!-- Animated voice wave circle -->
    <circle cx="187.5" cy="80" r="72" fill="rgba(139,111,92,0.05)" stroke="rgba(139,111,92,0.1)" stroke-width="2">
      <animate attributeName="r" values="72;80;72" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="187.5" cy="80" r="56" fill="rgba(139,111,92,0.1)" stroke="rgba(139,111,92,0.15)" stroke-width="2">
      <animate attributeName="r" values="56;64;56" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="187.5" cy="80" r="40" fill="rgba(139,111,92,0.15)"/>

    <!-- Mother and child icon -->
    <circle cx="180" cy="68" r="12" fill="#8B6F5C"/>
    <path d="M168 96 C168 84 176 78 180 78 C184 78 192 84 192 96" fill="#8B6F5C"/>
    <circle cx="196" cy="78" r="8" fill="#C4A98C"/>
    <path d="M188 96 C188 88 192 84 196 84 C200 84 204 88 204 96" fill="#C4A98C"/>

    <!-- App Name -->
    <text x="187.5" y="180" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#2D2926" text-anchor="middle">माँ</text>
    <text x="187.5" y="206" font-family="-apple-system, sans-serif" font-size="14" fill="#8A837C" text-anchor="middle">Women's Health Companion</text>
  </g>

  <!-- Voice Greeting Card -->
  <rect x="24" y="340" width="327" height="160" rx="16" fill="#F5F0EB"/>

  <!-- Speaker icon with animation indicator -->
  <circle cx="64" cy="380" r="24" fill="rgba(139,111,92,0.15)"/>
  <rect x="56" y="372" width="4" height="16" rx="2" fill="#8B6F5C">
    <animate attributeName="height" values="16;8;16" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="372;376;372" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="370" width="4" height="20" rx="2" fill="#8B6F5C">
    <animate attributeName="height" values="20;12;20" dur="0.5s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="y" values="370;374;370" dur="0.5s" repeatCount="indefinite" begin="0.1s"/>
  </rect>
  <rect x="68" y="374" width="4" height="12" rx="2" fill="#8B6F5C">
    <animate attributeName="height" values="12;18;12" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="y" values="374;371;374" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
  </rect>

  <!-- Detected Location Badge -->
  <rect x="100" y="364" width="100" height="24" rx="12" fill="rgba(74,124,89,0.15)"/>
  <circle cx="114" cy="376" r="6" fill="#4A7C59"/>
  <text x="128" y="380" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#4A7C59">Karnataka</text>

  <!-- Voice message in detected language -->
  <text x="48" y="420" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#2D2926">ನಮಸ್ಕಾರ! ನಾನು ಮಾ.</text>
  <text x="48" y="444" font-family="-apple-system, sans-serif" font-size="15" fill="#5C5550">ನಿಮ್ಮ ಭಾಷೆ ಕನ್ನಡ ಎಂದು</text>
  <text x="48" y="466" font-family="-apple-system, sans-serif" font-size="15" fill="#5C5550">ಊಹಿಸುತ್ತಿದ್ದೇನೆ. ಸರಿಯೇ?</text>

  <!-- English translation (subtle) -->
  <text x="48" y="490" font-family="-apple-system, sans-serif" font-size="11" fill="#8A837C" font-style="italic">"Hello! I'm Maa. I'm guessing your language is Kannada. Is that right?"</text>

  <!-- Voice Response Options -->
  <text x="187.5" y="540" font-family="-apple-system, sans-serif" font-size="13" fill="#8A837C" text-anchor="middle">Respond with voice or tap</text>

  <!-- Yes Button (Primary) -->
  <rect x="24" y="560" width="200" height="64" rx="12" fill="#8B6F5C"/>
  <text x="124" y="588" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">ಹೌದು</text>
  <text x="124" y="610" font-family="-apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Yes, Kannada</text>

  <!-- Different Language Button -->
  <rect x="232" y="560" width="119" height="64" rx="12" fill="#F5F0EB" stroke="#D4CEC6" stroke-width="1"/>
  <text x="291.5" y="588" font-family="-apple-system, sans-serif" font-size="18" font-weight="500" fill="#5C5550" text-anchor="middle">ಬೇರೆ</text>
  <text x="291.5" y="608" font-family="-apple-system, sans-serif" font-size="11" fill="#8A837C" text-anchor="middle">Different</text>

  <!-- Microphone Button (Voice Input) -->
  <g transform="translate(187.5, 680)">
    <circle cx="0" cy="0" r="36" fill="#8B6F5C"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(139,111,92,0.3)" stroke-width="2"/>
    <!-- Microphone icon -->
    <rect x="-6" y="-14" width="12" height="18" rx="6" fill="#FFFFFF"/>
    <path d="M-12 0 C-12 8 -6 14 0 14 C6 14 12 8 12 0" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="14" x2="0" y2="20" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <text x="187.5" y="744" font-family="-apple-system, sans-serif" font-size="12" fill="#8A837C" text-anchor="middle">Tap to speak your response</text>

  <!-- Home Indicator -->
  <rect x="140" y="796" width="95" height="5" rx="2.5" fill="#2D2926"/>
</svg>