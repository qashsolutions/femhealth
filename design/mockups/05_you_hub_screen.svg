    <circle cx="22" cy="10" r="5" fill="none" stroke="#8A837C" stroke-width="1.5"/>
    <text x="15" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#8A837C" text-anchor="middle">Learn</text>
