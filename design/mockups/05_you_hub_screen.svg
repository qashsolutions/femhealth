    <ellipse cx="15" cy="8" rx="4" ry="4" fill="none" stroke="#8A837C" stroke-width="1.5"/>
    <path d="M2 22 C2 18 8 16 15 16 C22 16 28 18 28 22" fill="none" stroke="#8A837C" stroke-width="1.5"/>
    <text x="15" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#8A837C" text-anchor="middle">Care</text>
