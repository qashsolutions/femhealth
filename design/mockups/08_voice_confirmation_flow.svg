<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#FAF7F2"/>
  <text x="21" y="30" font-family="SF Pro, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#2D2926">9:41</text>
  <rect x="336" y="17" width="25" height="12" rx="3" stroke="#2D2926" stroke-width="1"/>
  <rect x="338" y="19" width="18" height="8" rx="2" fill="#2D2926"/>
  <rect x="361" y="20" width="1.5" height="5" rx="0.5" fill="#2D2926"/>

  <!-- Background -->
  <rect y="44" width="375" height="768" fill="#FAF7F2"/>

  <!-- Header -->
  <rect y="44" width="375" height="64" fill="#FAF7F2"/>
  <text x="24" y="88" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#2D2926">Log Symptoms</text>

  <!-- Voice Input Flow Diagram -->
  <text x="24" y="136" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#2D2926">Voice-First Input Flow</text>

  <!-- Step 1: Speak -->
  <g transform="translate(24, 156)">
    <rect width="327" height="80" rx="12" fill="#F5F0EB"/>

    <!-- Step indicator -->
    <circle cx="28" cy="40" r="16" fill="#8B6F5C"/>
    <text x="28" y="45" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>

    <text x="56" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#2D2926">You Speak</text>
    <text x="56" y="52" font-family="-apple-system, sans-serif" font-size="13" fill="#5C5550">"मुझे सिर में दर्द है और चक्कर आ रहा है"</text>
    <text x="56" y="68" font-family="-apple-system, sans-serif" font-size="11" fill="#8A837C" font-style="italic">"I have a headache and feeling dizzy"</text>

    <!-- Voice wave icon -->
    <g transform="translate(280, 28)">
      <rect x="0" y="4" width="3" height="16" rx="1.5" fill="#8B6F5C"/>
      <rect x="6" y="0" width="3" height="24" rx="1.5" fill="#8B6F5C"/>
      <rect x="12" y="6" width="3" height="12" rx="1.5" fill="#8B6F5C"/>
      <rect x="18" y="2" width="3" height="20" rx="1.5" fill="#8B6F5C"/>
      <rect x="24" y="8" width="3" height="8" rx="1.5" fill="#8B6F5C"/>
    </g>
  </g>

  <!-- Arrow down -->
  <path d="M187.5 244 L187.5 260 M180 252 L187.5 264 L195 252" stroke="#8A837C" stroke-width="2" fill="none"/>

  <!-- Step 2: We Transcribe -->
  <g transform="translate(24, 272)">
    <rect width="327" height="100" rx="12" fill="#F5F0EB"/>

    <circle cx="28" cy="50" r="16" fill="#8B6F5C"/>
    <text x="28" y="55" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>

    <text x="56" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#2D2926">We Understand</text>

    <!-- Parsed data card -->
    <rect x="56" y="44" width="255" height="48" rx="8" fill="#EDE6DD"/>
    <g transform="translate(68, 56)">
      <rect width="72" height="24" rx="4" fill="rgba(204,123,74,0.2)"/>
      <text x="36" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#CC7B4A" text-anchor="middle">🤕 Headache</text>
    </g>
    <g transform="translate(148, 56)">
      <rect width="64" height="24" rx="4" fill="rgba(212,168,75,0.2)"/>
      <text x="32" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#D4A84B" text-anchor="middle">😵 Dizzy</text>
    </g>
    <g transform="translate(220, 56)">
      <rect width="80" height="24" rx="4" fill="rgba(91,123,140,0.2)"/>
      <text x="40" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#5B7B8C" text-anchor="middle">📍 Head</text>
    </g>
  </g>

  <!-- Arrow down -->
  <path d="M187.5 380 L187.5 396 M180 388 L187.5 400 L195 388" stroke="#8A837C" stroke-width="2" fill="none"/>

  <!-- Step 3: You Confirm -->
  <g transform="translate(24, 408)">
    <rect width="327" height="120" rx="12" fill="#E8F0EA" stroke="#4A7C59" stroke-width="2"/>

    <circle cx="28" cy="60" r="16" fill="#4A7C59"/>
    <text x="28" y="65" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>

    <text x="56" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#2D2926">You Confirm</text>
    <text x="56" y="52" font-family="-apple-system, sans-serif" font-size="13" fill="#5C5550">"Is this correct?"</text>
    <text x="56" y="72" font-family="-apple-system, sans-serif" font-size="13" fill="#5C5550">"क्या यह सही है?"</text>

    <!-- Confirm buttons -->
    <rect x="56" y="88" width="100" height="24" rx="6" fill="#4A7C59"/>
    <text x="106" y="104" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">✓ हाँ, सही है</text>

    <rect x="164" y="88" width="80" height="24" rx="6" fill="#FFFFFF" stroke="#D4CEC6"/>
    <text x="204" y="104" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#5C5550" text-anchor="middle">Edit</text>

    <rect x="252" y="88" width="60" height="24" rx="6" fill="#FFFFFF" stroke="#D4CEC6"/>
    <text x="282" y="104" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#5C5550" text-anchor="middle">Cancel</text>
  </g>

  <!-- Arrow down -->
  <path d="M187.5 536 L187.5 552 M180 544 L187.5 556 L195 544" stroke="#8A837C" stroke-width="2" fill="none"/>

  <!-- Step 4: Agent Executes -->
  <g transform="translate(24, 564)">
    <rect width="327" height="100" rx="12" fill="#F5F0EB"/>

    <circle cx="28" cy="50" r="16" fill="#8B6F5C"/>
    <text x="28" y="55" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>

    <text x="56" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#2D2926">Maa Analyzes</text>
    <text x="56" y="52" font-family="-apple-system, sans-serif" font-size="13" fill="#5C5550">AI triage running...</text>

    <!-- Processing animation -->
    <g transform="translate(56, 64)">
      <rect width="255" height="8" rx="4" fill="#EDE6DD"/>
      <rect width="160" height="8" rx="4" fill="#8B6F5C">
        <animate attributeName="width" values="0;160;255;160" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="56" y="92" font-family="-apple-system, sans-serif" font-size="11" fill="#8A837C">Checking symptoms against medical guidelines...</text>
  </g>

  <!-- Key Benefits -->
  <g transform="translate(24, 688)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#8A837C">WHY VOICE-FIRST?</text>

    <g transform="translate(0, 16)">
      <circle cx="8" cy="8" r="4" fill="#4A7C59"/>
      <text x="20" y="12" font-family="-apple-system, sans-serif" font-size="11" fill="#5C5550">Accessible for all literacy levels</text>
    </g>
    <g transform="translate(0, 36)">
      <circle cx="8" cy="8" r="4" fill="#4A7C59"/>
      <text x="20" y="12" font-family="-apple-system, sans-serif" font-size="11" fill="#5C5550">Natural expression in native language</text>
    </g>
    <g transform="translate(0, 56)">
      <circle cx="8" cy="8" r="4" fill="#4A7C59"/>
      <text x="20" y="12" font-family="-apple-system, sans-serif" font-size="11" fill="#5C5550">User always in control before AI acts</text>
    </g>
  </g>

  <!-- Home Indicator -->
  <rect x="140" y="796" width="95" height="5" rx="2.5" fill="#2D2926"/>
</svg>