    <circle cx="187.5" cy="60" r="32" fill="rgba(139,111,92,0.2)"/>
    <!-- Mother and child icon -->
    <circle cx="180" cy="48" r="12" fill="#8B6F5C"/>
    <path d="M168 76 C168 64 176 58 180 58 C184 58 192 64 192 76" fill="#8B6F5C"/>
    <circle cx="196" cy="58" r="8" fill="#C4A98C"/>
    <path d="M188 76 C188 68 192 64 196 64 C200 64 204 68 204 76" fill="#C4A98C"/>

