    <text x="165.5" y="24" font-family="-apple-system, sans-serif" font-size="16" fill="#5C5550" text-anchor="middle">اردو</text>
    <text x="165.5" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#8A837C" text-anchor="middle">Urdu</text>

