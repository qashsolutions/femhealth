    <text x="187.5" y="140" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2D2926" text-anchor="middle">माँ</text>
    <text x="187.5" y="168" font-family="Georgia, serif" font-size="18" fill="#5C5550" text-anchor="middle">Maa</text>
